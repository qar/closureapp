name: Closure
options:
  bundleIdPrefix: com.qar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_OBJC_ARC: YES
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Release:
      LLVM_LTO: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
targets:
  Closure:
    type: application
    platform: iOS
    configFiles:
      Debug: Closure/GoogleOAuth.xcconfig
      Release: Closure/GoogleOAuth.xcconfig
    sources:
      - path: Closure
      - path: ../core/src
      - path: ../core/include
    settings:
      base:
        PRODUCT_NAME: Closure
        # iPhone only: the layout is designed for iPhone. XcodeGen's iOS default is "1,2".
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.qar.closure
        INFOPLIST_FILE: Closure/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Closure/Bridge/Closure-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../core/include
          - $(SRCROOT)/../core/src
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Same App Store Connect team as Modocus (Qiao Anran, paid account).
        DEVELOPMENT_TEAM: L9WF5HSH87
        ENABLE_PREVIEWS: YES
    dependencies:
      - sdk: libsqlite3.tbd
    scheme:
      testTargets:
        - ClosureTests
  ClosureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClosureTests
      # Plain Foundation code, compiled straight into the tests without a host app.
      - path: Closure/Library/FileImporter.swift
      - path: Closure/Library/AlbumTitleParts.swift
      - path: Closure/Library/ArtworkStore.swift
      - path: Closure/Library/LibraryModels.swift
      - path: Closure/Library/LegacyAudioTags.swift
      - path: Closure/Library/LibrarySearchIndex.swift
      - path: Closure/Library/TrashStore.swift
      - path: Closure/Library/LibraryDatabase.swift
      - path: Closure/Library/GoogleDrive.swift
      - path: Closure/Library/DownloadJob.swift
      - path: Closure/Library/DriveDownloadManager.swift
      - path: Closure/Library/ContentIndex.swift
      - path: Closure/Library/PlaybackState.swift
      - path: Closure/Library/StorageSummary.swift
      - path: Closure/Library/FileProblems.swift
      - path: Closure/Library/AlbumOverride.swift
      - path: Closure/Library/TrackOverride.swift
      - path: Closure/Library/MusicBrainz.swift
      - path: Closure/Library/Lyrics.swift
      - path: Closure/Library/Playlist.swift
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qar.closure.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L9WF5HSH87
