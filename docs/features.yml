    notes: iOS 实测（iPhone 12 Pro，Debug 构建，2026-11-16）：50,017 首读库并分组 251–264 ms；有 5 万行时扫描（比对加删除）254 ms。读库、分组、扫描都在后台 actor，标签 4 个文件并发读取，扫描中约每秒刷新一次，可以边扫边浏览和播放。尚未用真实 5 万个文件测首次导入时的标签读取速度。

  - id: library.tag-parsing
    title: 宽容的标签解析，不乱码
    category: library
    priority: P0
    platforms: { ios: done, macos: partial }
    why: [reviews-2026-11（标签读错、文件名乱码、俄语乱码）, forums-2026-11]
    acceptance:
      - 支持 ID3v1/v2（含 GBK、Big5 等非 UTF-8 编码）、Vorbis comment、MP4 和 APE 标签。
      - 读取标题、艺人、专辑、专辑艺人、碟号、音轨号、年份、流派、作曲家、内嵌封面、内嵌歌词。
      - 用一组故意写坏的标签样本做回归测试。
    notes: iOS 读取 FLAC Vorbis comment、M4A、MP3 ID3v2，以及支持的音频文件末尾的 ID3v1、APEv2 标签。读取标题、艺人、专辑、专辑艺人、碟号、音轨号、年份、流派、作曲家、内嵌封面和歌词。ID3 中按 Latin-1 存放的 GBK/Big5 文本会被修复为中文，拉丁文名不受影响。2026-11-18 加入故意使用 GBK 字节、损坏 APEv2 长度和两种标签冲突的回归样本。APE 音频解码仍见 format.ape（P3）。macOS 不读作曲家。

  - id: library.album-grouping
    title: 按专辑艺人归类，合辑不拆散，多碟顺序正确
    category: library
    priority: P0
    platforms: { ios: done, macos: partial }
    why: [reviews-2026-11（按单曲艺人归类导致合辑被拆散；多碟顺序乱）]
    acceptance:
      - 合辑显示为一张专辑。多碟专辑按碟号、再按音轨号排序。
      - 文件夹名不用于推断专辑名或专辑成员；不同文件夹中标签相同的曲目可以归入同一专辑。
      - 没有专辑标签的曲目留在 Tracks，不凭文件夹名创建专辑，也不推断为单曲；用户可以手动指定专辑。
    notes: >-
      iOS 优先按专辑艺人和专辑标签归类。缺少专辑艺人时，使用曲目艺人和专辑标签；
      有合辑标记时按合辑和专辑标签归类。缺少足够标签导致的歧义由用户手动合并或拆分。
      按碟号、音轨号、文件名排序；带专辑标签的 CD1/CD2 子目录可提供缺失的碟号，
      但不参与专辑归属。2026-11-18 的单元测试覆盖无标签曲目、跨文件夹归类及旧库编辑迁移。
      macOS 当前仍以文件夹为专辑，尚未按这两条新增标准验收。

