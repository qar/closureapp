# Closure 产品需求定义
#
# 本文件收集并维护 Closure 的产品需求。当前以 iOS 为重点平台，其他平台的状态一并记录。
# 新增或修改需求时，只改这个文件。代码实现完成并通过验收后，再把对应平台的状态改为 done。
#
# 字段说明
#   id          稳定标识，格式为 <分类>.<短名>。不要重用已删除的 id。
#   title       一句话描述需求。
#   category    分类，取值见 categories。
#   priority    优先级，取值见 priorities。以当前重点平台 iOS 为准。
#   platforms   每个平台一个状态，取值见 statuses。没有列出的平台表示尚未评估。
#   why         需求依据。引用 sources 里的调研时写调研 id。
#   acceptance  验收标准。每一条都要能检查或测量。
#   notes       可选。补充约束、风险或各平台的差异。

version: 1

platforms:
  ios: iPhone 版
  ipados: iPad 版
  macos: Mac 版
  watchos: Apple Watch 版

statuses:
  done: 已实现，并满足验收标准
  partial: 已有部分实现或原型，尚未满足全部验收标准
  planned: 计划做，尚未开始
  deferred: 暂缓。有需求，但当前不做
  not-planned: 明确不做
  n/a: 该平台不适用

priorities:
  P0: 首次上架前必须完成
  P1: 上架后第一批完成
  P2: 后续版本
  P3: 候选，需要更多依据再决定

categories:
  playback: 播放
  library: 曲库
  lyrics: 歌词
  integration: 系统集成
  sync: 同步与备份
  format: 格式支持
  quality: 质量证明
  commerce: 商业
  ux: 体验与无障碍
  platform: 平台

sources:
  reviews-2026-11: >-
    2026-11 竞品 App Store 差评调研。20 个竞品、6 个区共 936 条评论，其中 1~3 星 218 条，
    人工分类。主题排行：曲库管理 56 条（18 个 App），播放中断 39 条（16 个），收费 37 条（9 个），
    界面难用 31 条，闪退卡顿 31 条，导入与文件丢失 25 条，网盘与 NAS 22 条，系统集成 19 条，
    停更 14 条，非拉丁文字 10 条，音质 8 条，切歌间隙 6 条，歌词 4 条。
    样本来自网页公开评论（按"最有帮助"排序），只反映相对重要性。
  forums-2026-11: >-
    2026-11 社区讨论调研（V2EX、知乎、英文对比文章）。高频需求：锁屏歌词、自动刮削、
    WiFi 传歌与网盘接入、界面简洁、标签兼容、CarPlay、无缝播放与 ReplayGain、买断制。
  vision: docs/VISION.md 与 docs/AUDIO_QUALITY_ROADMAP.md 中的产品原则。

# 由调研得出的产品原则。具体需求不得违反这些原则。
principles:
  - 不改动信号。默认数字增益为 1，不加隐藏的音效或响度处理。改动信号的功能必须由用户开启。
  - 绝不丢失用户的文件。任何删除都要用户确认。
  - 一次性买断。本地播放与曲库功能全部包含在内，不加广告，不用倒计时等手段诱导购买。
  - 曲库在本地由 App 管理。云端只做备份，不做流媒体播放。
  - 质量承诺必须可测量，并附测试方法。

features:
  # ---------------------------------------------------------------- 播放

  - id: playback.gapless
    title: 采样级无缝播放
    category: playback
    priority: P0
    platforms: { ios: done, macos: done }
    why: [reviews-2026-11（切歌间隙 6 条，5 个 App）, forums-2026-11]
    acceptance:
      - 自动测试：曲目边界误差为 0 个采样，重复 50 次全部通过。
      - 真机播放整张现场专辑，曲间无可闻的间隙或爆音。

  - id: playback.unity-gain
    title: 数字增益固定为 1，音量交给系统
    category: playback
    priority: P0
    platforms: { ios: done, macos: planned }
    why: [vision, reviews-2026-11（有用户听出强制调音导致的失真）]
    acceptance:
      - null test：在源采样率等于输出采样率时，输出与解码结果逐个采样相同。
    notes: macOS 版当前默认软件增益为 0.85，见 AUDIO_QUALITY_ROADMAP.md 第 3 项。

  - id: playback.sample-rate-match
    title: 按专辑把硬件采样率切到源采样率
    category: playback
    priority: P0
    platforms: { ios: done, macos: planned }
    why: [vision]
    acceptance:
      - 设备支持源采样率时，信号路径显示"无重采样"。
      - 同一队列内不切换采样率，保证无缝播放。
    notes: iOS 内置扬声器可能固定在 48 kHz，此时由 playback.hq-resampling 处理。

  - id: playback.hq-resampling
    title: 无法匹配采样率时，使用最高质量重采样
    category: playback
    priority: P1
    platforms: { ios: done, macos: planned }
    why: [vision]
    acceptance:
      - 测量报告给出通带波动、阻带衰减和 THD+N，并与 macOS 现有实现对比。

  - id: playback.background-reliability
    title: 锁屏和后台长时间稳定播放
    category: playback
    priority: P0
    platforms: { ios: partial }
    why: [reviews-2026-11（播放中断 39 条，16 个 App；"要一直亮屏才能播"）]
    acceptance:
      - 真机锁屏连续播放 4 小时，零中断、零欠载，重复 3 次。
      - 播放中切到其他 App、接收通知、低电量模式下不停播。
    notes: >-
      iOS 已配置 audio 后台模式，音频会话使用 playback 类别；2026-11-18 改为激活时确认类别设置成功，
      设置失败会报告播放错误。Entropy 当前可连续占用不足 4 小时，三轮各 4 小时锁屏播放、
      切到其他 App、通知和低电量模式验收尚未完成，故保持 partial。

  - id: playback.interruptions
    title: 正确处理来电等打断和输出设备变化
    category: playback
    priority: P0
    platforms: { ios: partial, macos: done }
    why: [reviews-2026-11（来电或拍照后不能自动恢复）]
    acceptance:
      - 来电结束后，按系统提示自动恢复播放。
      - 拔出耳机或断开蓝牙时暂停，不转到扬声器播放。
      - 硬件采样率变化后，从原位置继续播放。
    notes: >-
      iOS 已处理系统打断、输出设备丢失和采样率变化。2026-11-18 补齐设备丢失时清除自动续播标记，
      并在输出重建失败时停止播放、报告错误并保留重试位置；内核测试确认采样率变化后保留曲目与位置。
      Entropy 已安装调试版并自动启动播放。来电、耳机及蓝牙真机验收按用户要求改天进行，故保持 partial。
      macOS 已有 DefaultOutputFollower。

  - id: playback.now-playing
    title: 锁屏、控制中心、耳机按键控制，并显示封面
    category: playback
    priority: P0
    platforms: { ios: partial, macos: planned }
    why: [reviews-2026-11（锁屏点击会打开系统音乐 App）]
    acceptance:
      - 锁屏和控制中心显示标题、艺人、专辑、封面和进度。
      - 播放、暂停、上一首、下一首、拖动进度都有效。
    notes: >-
      iOS 已发布标题、艺人、专辑、封面、进度和播放状态，并接入播放、暂停、上一首、下一首与拖动进度命令。
      2026-11-18 增加系统信息快照测试及旧封面切歌保护；远程命令回调统一投递到主 actor，
      避免后台回调直接访问播放器。锁屏、控制中心和耳机按键尚未逐项真机验收，
      故保持 partial。

  - id: playback.declick
    title: 开始、暂停、跳转时不爆音
    category: playback
    priority: P1
    platforms: { ios: done, macos: planned }
    acceptance:
      - 测量暂停和跳转处的跳变能量，低于设定阈值。

  - id: playback.shuffle
    title: 随机播放
    category: playback
    priority: P0
    platforms: { ios: done, macos: planned }
    why: [reviews-2026-11（多个 App 因没有随机播放或随机不均匀被差评）]
    acceptance:
      - 随机顺序在一轮内不重复。
      - 随机播放下仍保持无缝衔接。
      - 正在播放页左下角是一个播放模式按钮，按常见约定在顺序播放、列表循环、单曲循环、随机播放之间循环切换，切换后在底部中间短暂显示模式名称；“…”菜单里也可以直接选择。
      - 切到随机时当前曲目不中断，只重排后面的曲目；离开随机后回到原顺序，从当前曲目在原顺序中的位置继续。
    notes: iOS 完成（2026-11-16）。随机播放会循环（同列表循环）。随机是持续模式：专辑页 Play 关闭随机、Shuffle 打开随机，点单曲保持当前模式（随机时点的那首先放，其余随机）。引擎新增 replaceQueue：解码器还没进入下一首时只给当前曲目重新编号，音频不受影响；已经预解码下一首时从当前位置重新解码（与改重复模式相同）。随机模式和原顺序随播放状态保存，重启后恢复。重复全部时每一轮使用同一个随机顺序。

  - id: playback.queue
    title: 播放队列：下一首播放、稍后播放、查看和调整队列
    category: playback
    priority: P1
    platforms: { ios: done, macos: partial }
    why: [reviews-2026-11]
    acceptance:
      - 可以把单曲或整张专辑加入队列，并调整顺序。
    notes: iOS 完成（2026-11-16）。专辑页、文件夹页、搜索结果的歌曲和资料库的专辑封面长按有“Play Next”和“Play Last”，加入时有轻触感反馈，当前曲目不中断（引擎 replaceQueue）。随机模式下插入的歌也进入原顺序，退出随机后仍在。队列页左滑移除（当前曲目不能移除），点 Edit 拖动排序。没有歌在播放时，这两项直接开始播放。

  - id: playback.resume-state
    title: 重启后恢复队列和播放位置
    category: playback
    priority: P1
    platforms: { ios: done, macos: partial }
    why: [reviews-2026-11（暂停一段时间后从头播放）]
    acceptance:
      - App 被系统结束后重新打开，队列、曲目和位置都与之前相同。
      - 打开 App 时不激活音频会话，不打断其他 App 正在播放的声音；按播放后才装载队列，先跳到保存的位置再出声。
      - 期间被删除的曲目从队列中去掉；当前曲目被删除时从下一首的开头继续。
    notes: iOS 在开始播放、暂停、切歌、拖动进度、改重复模式和 App 离开前台时保存（2026-11-16），不用定时器，不增加耗电。macOS 当前恢复播放列表，不恢复播放位置。

  - id: playback.signal-path
    title: 显示完整信号路径
    category: playback
    priority: P1
    platforms: { ios: done, macos: planned }
    why: [vision]
    acceptance:
      - 显示文件格式、硬件采样率、引擎输出采样率、是否重采样、增益、输出设备、欠载次数。

  - id: playback.replaygain
    title: ReplayGain（曲目和专辑模式）
    category: playback
    priority: P2
    platforms: { ios: planned, macos: planned }
    why: [forums-2026-11, vision]
    acceptance:
      - 默认关闭。开启后按标签调整增益，防止削波。
    notes: 会改动信号，必须由用户开启。见 AUDIO_QUALITY_ROADMAP.md 第 4 项。

  - id: playback.eq
    title: 可选均衡器
    category: playback
    priority: P3
    platforms: { ios: deferred, macos: deferred }
    why: [reviews-2026-11（EQ 被锁进订阅是差评重点）]
    notes: 如果做，必须默认关闭，并包含在买断价格内。

  # ---------------------------------------------------------------- 曲库

  - id: library.import
    title: 从"文件"App 导入文件和文件夹
    category: library
    priority: P0
    platforms: { ios: done, macos: done }
    acceptance:
      - 导入 iCloud Drive、U 盘、SMB 上的文件和文件夹，保留文件夹结构。
      - 来源文件从不被修改或删除。
    notes: iOS 通过“文件”选择器访问本机和 iCloud Drive，再把文件拷进 App 私有目录。macOS 按文件夹引用原位置，不拷贝。

  # 文件管理采用 B 方案（2026-11-16 确认）：磁盘上的文件保持导入时的样子，
  # 不按标签重排、不重命名；所有整理（专辑、艺人、标签修正、歌单）都记在曲库数据库里。

  - id: library.keep-file-layout
    title: 文件保持导入时的结构，整理全部在软件层面完成
    category: library
    priority: P0
    platforms: { ios: done, macos: done }
    acceptance:
      - 导入后，文件夹名、文件名、目录结构与来源相同。
      - 编辑标签、合并或拆分专辑、歌单和收藏只改数据库，不改文件。
      - 文件只在用户明确操作时才变化（删除、在文件夹视图中移动或重命名）。
    notes: >-
      2026-11-18：导入保持原目录层级；专辑和曲目标签编辑、专辑合并及拆分、歌单和收藏
      均只写 SQLite，不改音频文件。测试覆盖数据库重载后的分组及文件内容不变。
      来源路径发生同名冲突时，导入器会给新文件名加序号以避免覆盖原文件。

  - id: library.companion-files
    title: 封面、歌词、CUE 等附属文件随音频一起导入
    category: library
    priority: P0
    platforms: { ios: done }
    acceptance:
      - 图片、.lrc、.cue、.log、.m3u、PDF、.txt、.nfo 保持在原相对位置。
      - .DS_Store 等系统垃圾文件不导入。不认识的文件留在原处并告诉用户。
    notes: 由 FileImporter 实现，有单元测试。

  - id: library.import-safety
    title: 导入失败或中断时不丢文件、不留残缺专辑
    category: library
    priority: P0
    platforms: { ios: done }
    acceptance:
      - 收件箱只移除已成功进入曲库的文件，只删除已清空的文件夹（单元测试覆盖）。
      - 导入前检查剩余空间，不够时不开始导入。
      - 先拷进暂存区并校验大小和哈希，所选文件夹作为一批一次性移入曲库。中断后可以继续。
      - 来自 iCloud Drive 的未下载文件先下载再导入。
      - 导入结束后报告导入了什么、跳过了什么、为什么。
    notes: >-
      2026-11-18 已补齐整批校验、大小及 SHA-256 校验、空间检查和中断恢复。
      新专辑以目录重命名一次提交；已有目录记录目标路径，失败时回滚，重启后续完。
      Finder 来源在整批成功后才删除。单元测试覆盖损坏复制、提交失败和两种恢复路径。
      2026-11-18 补齐“文件”App 导入时对不支持文件及无音频文件夹的结果报告；整张专辑重复时也会报告未导入的文件。
      2026-11-18 Entropy 真机从 iCloud Drive 导入未下载的 M4A 成功：单文件进入私有曲库，
      SQLite 曲目大小与文件实际大小同为 8,519,520 字节，暂存区为空。来源通过复制模式导入，
      不会被修改或删除。本项验收完成。

  - id: library.target-folder
    title: 导入时选择放进曲库中的哪个文件夹
    category: library
    priority: P1
    platforms: { ios: planned }
    acceptance:
      - 可以选择已有文件夹或新建文件夹。默认放在曲库根目录，保持来源文件夹的名字。

  - id: library.folder-view
    title: 按原始文件夹结构浏览
    category: library
    priority: P1
    platforms: { ios: partial, macos: partial }
    why: [reviews-2026-11（不能按文件夹浏览，古典乐用户尤其需要）]
    notes: iOS（2026-11-16）：Folders 从资料库标签移到 Library Info → Folders（资料库只留 Albums、Artists、Playlists）。列出每个含音频的文件夹（嵌套的显示上级路径），点开按文件名列出曲目。尚未做：逐层展开的目录树。

  - id: library.trash
    title: 最近删除
    category: library
    priority: P0
    platforms: { ios: done }
    why: [principles（绝不丢失用户的文件）]
    acceptance:
      - 删除的文件先进"最近删除"，到期后才真正清除，期间可以恢复。
      - 批量删除前要确认。
    notes: iOS 已实现（2026-11-16）：删除后文件连同同名歌词、CUE 移入 Application Support/Trash，可原位恢复（重名时另存为“名称 2”），30 天后启动时清除，全部删除前确认。保留期 30 天待用户最终确认。单曲删除和整张专辑删除（library.delete-album）已有，批量选择尚未实现（见 library.batch-ops）。

  - id: library.delete-album
    title: 删除整张专辑
    category: library
    priority: P0
    platforms: { ios: done }
    why: [principles（任何删除都要用户确认）, 用户反馈 2026-11-17（App 中缺少移除专辑的能力）]
    acceptance:
      - 专辑页的"…"菜单有"Delete Album…"，确认框写明曲目数和去向。
      - 每首曲目单独进"最近删除"，可以只恢复其中一首。
      - 专辑文件夹里剩下的封面、小册子等文件随后进"最近删除"（一条记录），空文件夹被移除；文件夹里还有其他专辑的音频时不动这些文件。
      - 恢复全部记录后曲目、封面和文件夹回到原位（单元测试覆盖）。
    notes: iOS 已实现（2026-11-17）。专辑元数据覆盖（标题、封面）留在数据库里，恢复后仍然生效。

  - id: library.storage-view
    title: 存储页：总占用、每张专辑的大小、剩余空间
    category: library
    priority: P1
    platforms: { ios: done }
    notes: iOS 完成（2026-11-16）。资料库右上角“…”进入 Library Info 页（Library 页只放音乐，管理入口不放在资料库底部）；页面依次是存储（本机用量条（音乐、其他、可用）和三项数字，说明 Recently Deleted 占用及释放时机，说明音乐不在 iCloud 备份里）、文件（Duplicates、Recently Deleted 入口）、专辑按大小排序，点开进入专辑。占用按磁盘实际分配大小统计（含封面、歌词），扫描后和 Recently Deleted 变化后在后台重新测量。

  - id: library.export
    title: 把专辑原样导出到"文件"App
    category: library
    priority: P1
    platforms: { ios: planned }
    why: [principles（用户的文件始终属于用户）]

  - id: library.cue
    title: CUE 整轨切分为虚拟曲目
    category: library
    priority: P1
    platforms: { ios: planned, macos: planned }
    why: [forums-2026-11（中文用户常见 FLAC/APE + CUE 整轨）]
