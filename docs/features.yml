# Closure 产品需求定义
#
# 本文件收集并维护 Closure 的产品需求。当前以 iOS 为重点平台，其他平台的状态一并记录。
# 新增或修改需求时，只改这个文件。代码实现完成并通过验收后，再把对应平台的状态改为 done。
#
# 字段说明
#   id          稳定标识，格式为 <分类>.<短名>。不要重用已删除的 id。
#   title       一句话描述需求。
#   category    分类，取值见 categories。
#   priority    优先级，取值见 priorities。以当前重点平台 iOS 为准。
#   platforms   每个平台一个状态，取值见 statuses。没有列出的平台表示尚未评估。
#   why         需求依据。引用 sources 里的调研时写调研 id。
#   acceptance  验收标准。每一条都要能检查或测量。
#   notes       可选。补充约束、风险或各平台的差异。

version: 1

platforms:
  ios: iPhone 版
  ipados: iPad 版
  macos: Mac 版
  watchos: Apple Watch 版

statuses:
  done: 已实现，并满足验收标准
  partial: 已有部分实现或原型，尚未满足全部验收标准
  planned: 计划做，尚未开始
  deferred: 暂缓。有需求，但当前不做
  not-planned: 明确不做
  n/a: 该平台不适用

priorities:
  P0: 首次上架前必须完成
  P1: 上架后第一批完成
  P2: 后续版本
  P3: 候选，需要更多依据再决定

categories:
  playback: 播放
  library: 曲库
  lyrics: 歌词
  integration: 系统集成
  sync: 同步与备份
  format: 格式支持
  quality: 质量证明
  commerce: 商业
  ux: 体验与无障碍
  platform: 平台

sources:
  reviews-2026-11: >-
    2026-11 竞品 App Store 差评调研。20 个竞品、6 个区共 936 条评论，其中 1~3 星 218 条，
    人工分类。主题排行：曲库管理 56 条（18 个 App），播放中断 39 条（16 个），收费 37 条（9 个），
    界面难用 31 条，闪退卡顿 31 条，导入与文件丢失 25 条，网盘与 NAS 22 条，系统集成 19 条，
    停更 14 条，非拉丁文字 10 条，音质 8 条，切歌间隙 6 条，歌词 4 条。
    样本来自网页公开评论（按"最有帮助"排序），只反映相对重要性。
  forums-2026-11: >-
    2026-11 社区讨论调研（V2EX、知乎、英文对比文章）。高频需求：锁屏歌词、自动刮削、
    WiFi 传歌与网盘接入、界面简洁、标签兼容、CarPlay、无缝播放与 ReplayGain、买断制。
  vision: docs/VISION.md 与 docs/AUDIO_QUALITY_ROADMAP.md 中的产品原则。

# 由调研得出的产品原则。具体需求不得违反这些原则。
principles:
  - 不改动信号。默认数字增益为 1，不加隐藏的音效或响度处理。改动信号的功能必须由用户开启。
  - 绝不丢失用户的文件。任何删除都要用户确认。
  - 一次性买断。本地播放与曲库功能全部包含在内，不加广告，不用倒计时等手段诱导购买。
  - 曲库在本地由 App 管理。云端只做备份，不做流媒体播放。
  - 质量承诺必须可测量，并附测试方法。

features:
  # ---------------------------------------------------------------- 播放

  - id: playback.gapless
    title: 采样级无缝播放
    category: playback
    priority: P0
    platforms: { ios: done, macos: done }
    why: [reviews-2026-11（切歌间隙 6 条，5 个 App）, forums-2026-11]
    acceptance:
      - 自动测试：曲目边界误差为 0 个采样，重复 50 次全部通过。
      - 真机播放整张现场专辑，曲间无可闻的间隙或爆音。

  - id: playback.unity-gain
    title: 数字增益固定为 1，音量交给系统
    category: playback
    priority: P0
    platforms: { ios: done, macos: planned }
    why: [vision, reviews-2026-11（有用户听出强制调音导致的失真）]
    acceptance:
      - null test：在源采样率等于输出采样率时，输出与解码结果逐个采样相同。
    notes: macOS 版当前默认软件增益为 0.85，见 AUDIO_QUALITY_ROADMAP.md 第 3 项。

  - id: playback.sample-rate-match
    title: 按专辑把硬件采样率切到源采样率
    category: playback
    priority: P0
    platforms: { ios: done, macos: planned }
    why: [vision]
    acceptance:
      - 设备支持源采样率时，信号路径显示"无重采样"。
      - 同一队列内不切换采样率，保证无缝播放。
    notes: iOS 内置扬声器可能固定在 48 kHz，此时由 playback.hq-resampling 处理。

  - id: playback.hq-resampling
    title: 无法匹配采样率时，使用最高质量重采样
    category: playback
    priority: P1
    platforms: { ios: done, macos: planned }
    why: [vision]
    acceptance:
      - 测量报告给出通带波动、阻带衰减和 THD+N，并与 macOS 现有实现对比。

  - id: playback.background-reliability
    title: 锁屏和后台长时间稳定播放
    category: playback
    priority: P0
    platforms: { ios: partial }
    why: [reviews-2026-11（播放中断 39 条，16 个 App；"要一直亮屏才能播"）]
    acceptance:
      - 真机锁屏连续播放 4 小时，零中断、零欠载，重复 3 次。
      - 播放中切到其他 App、接收通知、低电量模式下不停播。
    notes: 原型已实现，尚未做长时间真机测试。

  - id: playback.interruptions
    title: 正确处理来电等打断和输出设备变化
    category: playback
    priority: P0
    platforms: { ios: partial, macos: done }
    why: [reviews-2026-11（来电或拍照后不能自动恢复）]
    acceptance:
      - 来电结束后，按系统提示自动恢复播放。
      - 拔出耳机或断开蓝牙时暂停，不转到扬声器播放。
      - 硬件采样率变化后，从原位置继续播放。
    notes: iOS 已实现，尚未在真机上逐项验证。macOS 已有 DefaultOutputFollower。

  - id: playback.now-playing
    title: 锁屏、控制中心、耳机按键控制，并显示封面
    category: playback
    priority: P0
    platforms: { ios: partial, macos: planned }
    why: [reviews-2026-11（锁屏点击会打开系统音乐 App）]
    acceptance:
      - 锁屏和控制中心显示标题、艺人、专辑、封面和进度。
      - 播放、暂停、上一首、下一首、拖动进度都有效。
    notes: iOS 已显示标题、艺人、专辑、封面和进度（2026-11-16）。尚未在真机上逐项验证锁屏和耳机按键。

  - id: playback.declick
    title: 开始、暂停、跳转时不爆音
    category: playback
    priority: P1
    platforms: { ios: done, macos: planned }
    acceptance:
      - 测量暂停和跳转处的跳变能量，低于设定阈值。

  - id: playback.shuffle
    title: 随机播放
    category: playback
    priority: P0
    platforms: { ios: partial, macos: planned }
    why: [reviews-2026-11（多个 App 因没有随机播放或随机不均匀被差评）]
    acceptance:
      - 随机顺序在一轮内不重复。
      - 随机播放下仍保持无缝衔接。
    notes: iOS 专辑页和文件夹页可以随机播放（打乱队列顺序）。正在播放页还没有随机模式开关。

  - id: playback.queue
    title: 播放队列：下一首播放、稍后播放、查看和调整队列
    category: playback
    priority: P1
    platforms: { ios: partial, macos: partial }
    why: [reviews-2026-11]
    acceptance:
      - 可以把单曲或整张专辑加入队列，并调整顺序。
    notes: iOS 可以查看队列并跳到任意曲目。还没有下一首播放和稍后播放。

  - id: playback.resume-state
    title: 重启后恢复队列和播放位置
    category: playback
    priority: P1
    platforms: { ios: planned, macos: partial }
    why: [reviews-2026-11（暂停一段时间后从头播放）]
    acceptance:
      - App 被系统结束后重新打开，队列、曲目和位置都与之前相同。
    notes: macOS 当前恢复播放列表，不恢复播放位置。

  - id: playback.signal-path
    title: 显示完整信号路径
    category: playback
    priority: P1
    platforms: { ios: done, macos: planned }
    why: [vision]
    acceptance:
      - 显示文件格式、硬件采样率、引擎输出采样率、是否重采样、增益、输出设备、欠载次数。

  - id: playback.replaygain
    title: ReplayGain（曲目和专辑模式）
    category: playback
    priority: P2
    platforms: { ios: planned, macos: planned }
    why: [forums-2026-11, vision]
    acceptance:
      - 默认关闭。开启后按标签调整增益，防止削波。
    notes: 会改动信号，必须由用户开启。见 AUDIO_QUALITY_ROADMAP.md 第 4 项。

  - id: playback.eq
    title: 可选均衡器
    category: playback
    priority: P3
    platforms: { ios: deferred, macos: deferred }
    why: [reviews-2026-11（EQ 被锁进订阅是差评重点）]
    notes: 如果做，必须默认关闭，并包含在买断价格内。

  # ---------------------------------------------------------------- 曲库

  - id: library.import
    title: 从"文件"App 导入文件和文件夹
    category: library
    priority: P0
    platforms: { ios: done, macos: done }
    acceptance:
      - 导入 iCloud Drive、U 盘、SMB 上的文件和文件夹，保留文件夹结构。
      - 来源文件从不被修改或删除。
    notes: iOS 把文件拷进 App 私有目录。macOS 按文件夹引用原位置，不拷贝。

  # 文件管理采用 B 方案（2026-11-16 确认）：磁盘上的文件保持导入时的样子，
  # 不按标签重排、不重命名；所有整理（专辑、艺人、标签修正、歌单）都记在曲库数据库里。

  - id: library.keep-file-layout
    title: 文件保持导入时的结构，整理全部在软件层面完成
    category: library
    priority: P0
    platforms: { ios: partial, macos: done }
    acceptance:
      - 导入后，文件夹名、文件名、目录结构与来源相同。
      - 编辑标签、合并或拆分专辑、歌单和收藏只改数据库，不改文件。
      - 文件只在用户明确操作时才变化（删除、在文件夹视图中移动或重命名）。
    notes: iOS 已保持结构。标签编辑尚未实现，见 library.metadata-edit。

  - id: library.companion-files
    title: 封面、歌词、CUE 等附属文件随音频一起导入
    category: library
    priority: P0
    platforms: { ios: done }
    acceptance:
      - 图片、.lrc、.cue、.log、.m3u、PDF、.txt、.nfo 保持在原相对位置。
      - .DS_Store 等系统垃圾文件不导入。不认识的文件留在原处并告诉用户。
    notes: 由 FileImporter 实现，有单元测试。

  - id: library.import-safety
    title: 导入失败或中断时不丢文件、不留残缺专辑
    category: library
    priority: P0
    platforms: { ios: partial }
    acceptance:
      - 收件箱只移除已成功进入曲库的文件，只删除已清空的文件夹（单元测试覆盖）。
      - 导入前检查剩余空间，不够时不开始导入。
      - 先拷进暂存区并校验大小和哈希，整张专辑一次性移入曲库。中断后可以继续。
      - 来自 iCloud Drive 的未下载文件先下载再导入。
      - 导入结束后报告导入了什么、跳过了什么、为什么。
    notes: iOS 已实现（2026-11-16）：导入在后台进行；先算总大小，空间不足（含 200 MB 余量）时不复制并提示差多少；从“文件”App 复制时边复制边算 SHA-256，读回校验后才整批移入曲库，校验失败的文件不进曲库；已校验的暂存带清单，下次启动续完，未校验的丢弃；收件箱只移除成功进入曲库的文件。通过 NSFileCoordinator 读取以触发 iCloud 下载，这一点尚未在真机的 iCloud Drive 上验证。

  - id: library.dedupe
    title: 导入时识别重复文件
    category: library
    priority: P1
    platforms: { ios: planned }
    acceptance:
      - 内容完全相同的文件跳过并告诉用户。路径相同但内容不同时，两份都保留，由用户选择。
    notes: 目前同名文件会以"名称 2"另存一份，不会覆盖已有文件。

  - id: library.target-folder
    title: 导入时选择放进曲库中的哪个文件夹
    category: library
    priority: P1
    platforms: { ios: planned }
    acceptance:
      - 可以选择已有文件夹或新建文件夹。默认放在曲库根目录，保持来源文件夹的名字。

  - id: library.folder-view
    title: 按原始文件夹结构浏览
    category: library
    priority: P1
    platforms: { ios: partial, macos: partial }
    why: [reviews-2026-11（不能按文件夹浏览，古典乐用户尤其需要）]
    notes: iOS 是平铺的文件夹列表，还不是层级浏览。

  - id: library.trash
    title: 最近删除
    category: library
    priority: P0
    platforms: { ios: done }
    why: [principles（绝不丢失用户的文件）]
    acceptance:
      - 删除的文件先进"最近删除"，到期后才真正清除，期间可以恢复。
      - 批量删除前要确认。
    notes: iOS 已实现（2026-11-16）：删除后文件连同同名歌词、CUE 移入 Application Support/Trash，可原位恢复（重名时另存为“名称 2”），30 天后启动时清除，全部删除前确认。保留期 30 天待用户最终确认。目前只有单曲删除，批量选择尚未实现（见 library.batch-ops）。

  - id: library.storage-view
    title: 存储页：总占用、每张专辑的大小、剩余空间
    category: library
    priority: P1
    platforms: { ios: planned }

  - id: library.export
    title: 把专辑原样导出到"文件"App
    category: library
    priority: P1
    platforms: { ios: planned }
    why: [principles（用户的文件始终属于用户）]

  - id: library.cue
    title: CUE 整轨切分为虚拟曲目
    category: library
    priority: P1
    platforms: { ios: planned, macos: planned }
    why: [forums-2026-11（中文用户常见 FLAC/APE + CUE 整轨）]
    notes: 是否放进首发（P0）待确认。

  - id: library.linked-folders
    title: 关联外部文件夹，只引用不拷贝（C 方案）
    category: library
    priority: P2
    platforms: { ios: planned, macos: done }
    why: [reviews-2026-11（想直接播放外接 SSD，不占手机空间）]
    notes: 与 App 管理的曲库并存。外部文件不可用时（iCloud 未下载、外接盘断开）必须在界面上标出。

  - id: library.google-drive-import
    title: 在 App 内浏览 Google Drive，选择文件或整个文件夹导入
    category: library
    priority: P1
    platforms: { ios: partial }
    why: [用户要求（2026-11-16）；竞品在 App 内浏览 Drive，系统浏览器里的选择器体验差]
    acceptance:
      - 登录一次后，在 App 内浏览“我的云端硬盘”“共享云端硬盘”“与我共享”，只显示文件夹和音频文件。
      - 可以跨文件夹多选文件或整个文件夹，导入走下载、空间检查、暂存校验流程。
      - 刷新令牌存放在钥匙串，访问令牌自动刷新；登录过期时提示重新登录；可以退出并撤销授权。
      - 下载页面显示总进度、速度、剩余时间和每个文件的状态；资料库底部有下载状态条，点开进入下载页面。
      - 下载在后台会话里进行，App 退到后台后继续；任务保存在磁盘上，App 重新启动后接着下载。
      - 前台同时下载 3 个文件；超时、断网、5xx、429 自动重试（最多 5 次，间隔 2、4、8、16 秒），服务器允许时从断点续传；401 换新令牌重试；404、403 等直接标为失败。
      - 单个文件失败不影响其他文件；失败的文件可以单独重试或全部重试；整个专辑下完（或只剩失败文件）后才导入，避免专辑分几次进资料库。
    notes: 使用受限权限 drive.readonly。测试状态下最多 100 个测试用户可用（会显示未验证提示，刷新令牌约 7 天过期）。正式发布前必须通过 Google 受限权限审核（约 6 周、每年复审，是否需要付费的 CASA 安全评估待确认）。审核被拒时退回 drive.file + Google 选择器（代码已保留）和“文件”App 导入。Google 授权页名称暂用 QAR Music，因为 Google 拒绝 “Closure” 这个名字。

  - id: library.dedupe
    title: 按内容去重：导入时跳过已有文件，清理已有的重复副本
    category: library
    priority: P1
    platforms: { ios: done }
    why: [用户要求（2026-11-16）；同一张专辑从“文件”App 和 Google Drive 各导入一次后出现三份]
    acceptance:
      - 只按内容（SHA-256）判断是否重复，不看文件名、标签或时长。先比大小，大小相同才计算哈希；哈希按路径、大小、修改时间缓存。
      - 导入时跳过资料库里已有相同内容的音频文件；整张专辑都已存在时，连封面等附属文件一起跳过。导入结果显示“已在资料库中”的数量。
      - Google Drive 用 Drive 提供的 SHA-256 在下载前比对，已有的文件不下载；Drive 没有提供哈希的文件在下载后由导入器比对。
      - Finder 拖进 Documents 的重复文件从 Documents 移除（资料库里有完全相同的内容）。
      - 资料库有重复时显示“Duplicates”入口。每组默认保留专辑文件夹里、文件名最短的一份，用户可以改选；其余移到 Recently Deleted，30 天内可恢复。
    notes: 不合并内容不同的“同一首歌”（不同格式、不同版本）。以后可以按标签和时长提示“可能重复”，由用户决定。

  - id: library.finder-transfer
    title: 通过 Finder 用数据线批量传歌
    category: library
    priority: P1
    platforms: { ios: done, macos: n/a }
    acceptance:
      - 放入 Finder 中 Closure 文件夹的音乐，在 App 回到前台后进入曲库。

  - id: library.share-sheet
    title: 从分享菜单"在 Closure 中打开"
    category: library
    priority: P2
    platforms: { ios: partial }
    notes: 已实现，未在真机验证。

  - id: library.wifi-transfer
    title: 局域网网页传歌
    category: library
    priority: P2
    platforms: { ios: planned, macos: n/a }
    why: [forums-2026-11]

  - id: library.file-safety
    title: 文件不丢失，存储占用清楚
    category: library
    priority: P0
    platforms: { ios: partial, macos: n/a }
    why: [reviews-2026-11（"离线文件凭空消失"，Evermusic、Flacbox）]
    acceptance:
      - App 更新后曲库完整，文件路径全部以相对路径保存。
      - 启动时发现缺失或损坏的文件，并告诉用户。
      - 设置中显示曲库占用空间。删除文件前要确认。
    notes: 曲库目录已排除在 iCloud 设备备份之外。在 sync.backup 完成前，换机或丢机会丢失音乐，需要在界面上说明。

  - id: library.database
    title: 用数据库保存曲库，替代 JSON 索引
    category: library
    priority: P0
    platforms: { ios: done, macos: partial }
    acceptance:
      - 5 万首曲目时，读写和查询都不阻塞界面。
    notes: iOS 用系统 SQLite（WAL，批量事务写入，schema 版本号），旧的 library.json 在首次启动时迁移后删除（2026-11-16）。macOS 用 library.xml。

  - id: library.performance
    title: 大曲库下秒开，边扫描边播放
    category: library
    priority: P0
    platforms: { ios: done, macos: planned }
    why: [reviews-2026-11（2 万首时每次点击都延迟数秒；必须扫描完才能播放）]
    acceptance:
      - 5 万首曲目时冷启动到可交互少于 1 秒（iPhone 12 级别设备）。
      - 增量扫描。扫描期间可以浏览和播放已识别的曲目。
    notes: iOS 实测（iPhone 12 Pro，Debug 构建，2026-11-16）：50,017 首读库并分组 251–264 ms；有 5 万行时扫描（比对加删除）254 ms。读库、分组、扫描都在后台 actor，标签 4 个文件并发读取，扫描中约每秒刷新一次，可以边扫边浏览和播放。尚未用真实 5 万个文件测首次导入时的标签读取速度。

  - id: library.tag-parsing
    title: 宽容的标签解析，不乱码
    category: library
    priority: P0
    platforms: { ios: partial, macos: partial }
    why: [reviews-2026-11（标签读错、文件名乱码、俄语乱码）, forums-2026-11]
    acceptance:
      - 支持 ID3v1/v2（含 GBK、Big5 等非 UTF-8 编码）、Vorbis comment、MP4 和 APE 标签。
      - 读取标题、艺人、专辑、专辑艺人、碟号、音轨号、年份、流派、作曲家、内嵌封面、内嵌歌词。
      - 用一组故意写坏的标签样本做回归测试。
    notes: iOS 读取 FLAC Vorbis comment、M4A、MP3 ID3 的标题、艺人、专辑、专辑艺人、碟号、音轨号、年份、作曲家、流派、合辑标记；ID3 中按 Latin-1 存放的 GBK/Big5 文本会被修复为中文，拉丁文名不受影响（2026-11-16，有随机往返测试：GB2312 全部修复，Big5 298/300）。尚未支持 APE 标签和 ID3v1，没有真实坏标签样本库。macOS 不读作曲家。

  - id: library.album-grouping
    title: 按专辑艺人归类，合辑不拆散，多碟顺序正确
    category: library
    priority: P0
    platforms: { ios: done, macos: done }
    why: [reviews-2026-11（按单曲艺人归类导致合辑被拆散；多碟顺序乱）]
    acceptance:
      - 合辑显示为一张专辑。多碟专辑按碟号、再按音轨号排序。
    notes: iOS 有专辑艺人标签时按“专辑艺人 + 专辑”归类，否则按“专辑文件夹 + 专辑”（CD1/CD2 子目录算作上级目录）。按碟号、音轨号、文件名排序，多碟专辑显示碟号小标题（2026-11-16，有单元测试和模拟器验证）。macOS 以文件夹为专辑。

  - id: library.browse-sort
    title: 按艺人、专辑、流派、作曲家、年份浏览和排序，带字母索引
    category: library
    priority: P1
    platforms: { ios: partial, macos: partial }
    why: [reviews-2026-11]
    notes: iOS 有专辑、艺人、文件夹三个视图。专辑固定按艺人排序，还不能选择排序方式和字母索引。

  - id: library.search
    title: 全库搜索，支持中文和拼音首字母
    category: library
    priority: P1
    platforms: { ios: partial, macos: planned }
    why: [reviews-2026-11（不能用中文搜索）]
    acceptance:
      - 可以按标题、艺人、专辑、作曲家搜索。输入"zjl"能找到"周杰伦"。
    notes: iOS 可以按标题、艺人搜索，忽略大小写和变音符号。还不支持拼音首字母和作曲家。

  - id: library.artwork
    title: 封面优先用内嵌图片，绝不错配，可手动替换
    category: library
    priority: P1
    platforms: { ios: partial, macos: done }
    why: [reviews-2026-11（自动配错封面，或所有歌同一张）]
    acceptance:
      - 顺序：内嵌封面，文件夹内 cover/folder 图片，用户指定。不自动联网替换。
    notes: iOS 先找文件夹图片（cover、folder、front 等，CD1/CD2 会找上级目录），再读内嵌封面（FLAC PICTURE 块，包括带 ID3 头的文件；其他格式用 AVFoundation）。还不能手动替换。

  - id: library.batch-ops
    title: 批量删除、批量加入歌单、批量收藏
    category: library
    priority: P1
    platforms: { ios: planned, macos: planned }
    why: [reviews-2026-11（不能批量删除，只能删 App 重装）]

  - id: library.playlists
    title: 歌单、歌单文件夹、收藏
