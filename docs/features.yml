    notes: iOS 完成（2026-11-16）。曲库目录排除在 iCloud 设备备份之外；Library Info 页显示占用并说明音乐不在 iCloud 备份里；删除前确认；路径全部相对。每次扫描后检查两类问题：引擎打不开的文件（不支持或损坏），以及不是用户删除的、从磁盘上消失的文件（移到 Recently Deleted 的不算）。首次发现时弹一次提示，可跳到 File Problems 页；读不了的文件可移到 Recently Deleted，缺失清单保存到用户清除为止。限制：只在读文件头时判断能否打开，文件头正常但中途截断的文件要到播放时才会报错。

