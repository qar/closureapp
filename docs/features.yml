    priority: P1
    platforms: { ios: planned, macos: planned }
    why: [reviews-2026-11（歌单不支持文件夹；离线歌单被收费）]

  - id: library.metadata-edit
    title: 在 App 内编辑标签
    category: library
    priority: P2
    platforms: { ios: planned, macos: partial }
    notes: macOS 可以修改专辑名、专辑艺人和封面。

  - id: library.musicbrainz
    title: 由用户触发的 MusicBrainz 元数据匹配
